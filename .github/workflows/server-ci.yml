name: Server CI

on:
  push:
    branches: [main, master, dev, development, aswath]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main, master, dev, development, aswath]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - 'pnpm-workspace.yaml'

jobs:
  server-lint-and-build:
    name: Lint & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm --filter server install

      - name: Run ESLint check
        working-directory: server
        run: pnpm run lint

      - name: Run TypeScript build check
        working-directory: server
        run: pnpm run build
