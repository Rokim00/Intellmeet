name: Client CI

on:
  push:
    branches: ['**']
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: ['**']
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

jobs:
  client-lint-and-build:
    name: Lint & TypeScript Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in the root package.json.
        # Do not pass `version:` here — action-setup errors when both are set.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm --filter client install

      - name: Run ESLint check
        working-directory: client
        run: pnpm run lint

      - name: Run TypeScript build check
        working-directory: client
        run: pnpm run build
